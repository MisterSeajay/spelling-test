[project]
name = "spelling-test"
version = "0.1.0"
description = "A simple spelling test"
readme = "README.md"
authors = [
    { name = "MisterSeajay", email = "19669091+MisterSeajay@users.noreply.github.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "edge-tts>=7.2.8",
    "jsonpath>=0.82.2",
    "loguru>=0.7.3",
    "pygame>=2.6.1",
    "rich>=13.9.4",
    "typer>=0.15.1",
]

[project.scripts]
spelling-test = "spelling_test.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pyright>=1.1.391",
    "ruff>=0.9.4",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "RUF", # ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.flake8-bugbear]
# Typer's documented pattern puts typer.Argument()/typer.Option() calls in
# parameter defaults, which B008 otherwise flags on every command.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["RUF059"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spelling_test"]

